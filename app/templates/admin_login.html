{% extends "base.html" %} {% block title %}Hidden Admin Login{% endblock %} {%
block head %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/admin_auth.css') }}"
/>
{% endblock %} {% block content %}
<main class="admin-auth container">
  <section class="auth-card">
    <h1>Administrator Login</h1>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label>Email</label>
        {{ form.email(class_='form-input') }}
      </div>
      <div class="form-group">
        <label>Password</label>
        {{ form.password(class_='form-input') }}
      </div>
      <div class="form-actions">
        {{ form.submit(class_='btn btn-primary') }}
      </div>
    </form>
  </section>
</main>
{% endblock %}
